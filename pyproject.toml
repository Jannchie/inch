[project]
name = "inch"
version = "0.2.0"
description = "A Python library for managing and executing long-running tasks in batches with visual progress tracking"
authors = [{ name = "Jianqi Pan", email = "jannchie@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=14.0.0",
    "redis>=6.2.0",
    "sqlalchemy>=2.0.41",
    "aiosqlite>=0.21.0",
]
license = { text = "MIT" }
keywords = [
    "progress",
    "concurrency",
    "multithreading",
    "batch-processing",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/jannchie/inch"
Documentation = "https://github.com/jannchie/inch#readme"
"Bug Tracker" = "https://github.com/jannchie/inch/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [".venv"]
line-length = 160

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "PGH",
    "RUF003",
    "BLE001",
    "ERA001",
    "FIX002",
    "TD002",
    "TD003",
    "D",
    "A004",
    "ANN201",
    "B008",
    "FAST002",
    "INP001",
    "S311",
    "PLR2004",
    "RUF002",
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ALL"]
"examples/*" = ["T201", "PLC0415", "C901", "PLR0915", "TRY003"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.2",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
markers = [
    "performance: marks tests as performance benchmarks (may be slow)",
]
